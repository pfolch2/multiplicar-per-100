
<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MULTIPLIQUEM PER 10, 100, 1000...</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    color: #111;
    margin: 0;
    padding: 20px;
}

.container {
    max-width: 950px;
    margin: auto;
    background: white;
    padding: 25px;
    border: 2px solid black;
}

h1 {
    text-align: center;
    font-size: 30px;
    margin-bottom: 10px;
}

.instruccions {
    text-align: center;
    font-size: 20px;
    margin-bottom: 30px;
    line-height: 1.5;
}

.exercici {
    border: 2px solid #222;
    padding: 18px;
    margin-bottom: 22px;
    background: white;
}

.enunciat {
    font-size: 27px;
    font-weight: bold;
    margin-bottom: 18px;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 9px;
}

/* Efecte de retolador fluorescent */
.blau {
    background: linear-gradient(
        transparent 35%,
        rgba(70, 160, 255, 0.55) 35%,
        rgba(70, 160, 255, 0.55) 90%,
        transparent 90%
    );
    padding: 2px 4px;
    border-radius: 3px;
}

.groc {
    background: linear-gradient(
        transparent 35%,
        rgba(255, 225, 50, 0.75) 35%,
        rgba(255, 225, 50, 0.75) 90%,
        transparent 90%
    );
    padding: 2px 4px;
    border-radius: 3px;
}

.resultat {
    display: flex;
    align-items: center;
    gap: 0;
    margin-bottom: 15px;
}

.resultat input {
    width: 105px;
    height: 58px;
    font-size: 27px;
    font-weight: bold;
    text-align: center;
    border: 3px solid black;
    outline: none;
    border-radius: 0;
}

.resultat input:first-child {
    border-right: 1px solid #777;
}

.resultat input:last-child {
    border-left: 1px solid #777;
}

.resultat .zona-blava {
    background: rgba(70, 160, 255, 0.22);
    border-color: #2585d8;
}

.resultat .zona-groga {
    background: rgba(255, 225, 50, 0.30);
    border-color: #d5b500;
}

.etiqueta-resultat {
    font-size: 16px;
    margin-bottom: 8px;
    font-weight: bold;
}

.botons {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
}

button {
    font-size: 18px;
    font-weight: bold;
    padding: 12px 20px;
    border: 2px solid black;
    cursor: pointer;
    background: white;
}

button:hover {
    background: #eaeaea;
}

.correcte {
    background: #c8f2c8;
    border: 3px solid green;
}

.incorrecte {
    background: #ffd1d1;
    border: 3px solid red;
}

.missatge {
    font-size: 19px;
    font-weight: bold;
    margin-top: 12px;
    min-height: 24px;
}

#resum {
    font-size: 22px;
    font-weight: bold;
    text-align: center;
    margin: 30px 0;
}

.pdf {
    display: block;
    margin: 25px auto 0;
    background: #222;
    color: white;
    padding: 16px 25px;
    font-size: 20px;
}

.llegenda {
    display: flex;
    justify-content: center;
    gap: 25px;
    flex-wrap: wrap;
    margin: 20px 0;
    font-size: 17px;
}

.llegenda span {
    padding: 5px 9px;
    font-weight: bold;
}

@media (max-width: 600px) {
    .container {
        padding: 12px;
    }

    .enunciat {
        font-size: 23px;
    }

    .resultat input {
        width: 85px;
        height: 55px;
        font-size: 23px;
    }
}
</style>
</head>

<body>

<div class="container">

<h1>MULTIPLIQUEM PER 10, 100, 1000...</h1>

<div class="instruccions">
    OBSERVA ELS NOMBRES I COMPLETA EL RESULTAT.<br>
    ESCRIU EL PRIMER NOMBRE A LA CASELLA BLAVA<br>
    I AFEGEIX ELS ZEROS A LA CASELLA GROGA.
</div>

<div class="llegenda">
    <span class="blau">PRIMER NOMBRE</span>
    <span class="groc">ZEROS QUE AFEGIM</span>
</div>

<div id="exercicis"></div>

<div id="resum"></div>

<button class="pdf" onclick="descarregarPDF()">
    DESCARREGAR RESULTATS EN PDF
</button>

</div>

<script>

const dades = [
    {a: "23", b: 10},
    {a: "45", b: 100},
    {a: "7", b: 1000},
    {a: "32", b: 10000},
    {a: "125", b: 10},
    {a: "54", b: 1000},
    {a: "8", b: 100},
    {a: "216", b: 100},
    {a: "43", b: 100000},
    {a: "12", b: 10000}
];

const resultats = [];

function crearExercicis() {
    const contenidor = document.getElementById("exercicis");

    dades.forEach((d, i) => {
        const zeros = d.b.toString().length - 1;
        const correcte = d.a + "0".repeat(zeros);

        resultats[i] = {
            resposta1: "",
            resposta2: "",
            estat: "PENDENT",
            correcte: correcte
        };

        const exercici = document.createElement("div");
        exercici.className = "exercici";
        exercici.id = "ex" + i;

        exercici.innerHTML = `
            <div class="enunciat">
                ${i + 1}. 
                <span class="blau">${d.a}</span>
                ×
                <span>${d.b.toString().slice(0, 1)}<span class="groc">${"0".repeat(zeros)}</span></span>
                =
            </div>

            <div class="etiqueta-resultat">
                ESCRIU EL RESULTAT:
            </div>

            <div class="resultat">
                <input
                    type="text"
                    inputmode="numeric"
                    maxlength="6"
                    id="r1_${i}"
                    class="zona-blava"
                    aria-label="Primer nombre de la resposta"
                >
                <input
                    type="text"
                    inputmode="numeric"
                    maxlength="6"
                    id="r2_${i}"
                    class="zona-groga"
                    aria-label="Zeros que afegim"
                >
            </div>

            <div class="botons">
                <button onclick="corregir(${i})">CORREGIR</button>
                <button onclick="reiniciar(${i})">TORNAR A COMENÇAR</button>
            </div>

            <div class="missatge" id="m${i}"></div>
        `;

        contenidor.appendChild(exercici);
    });

    actualitzarResum();
}

function corregir(i) {
    const resposta1 = document.getElementById("r1_" + i).value.trim();
    const resposta2 = document.getElementById("r2_" + i).value.trim();

    const correcte1 = dades[i].a;
    const zeros = dades[i].b.toString().length - 1;
    const correcte2 = "0".repeat(zeros);

    const missatge = document.getElementById("m" + i);
    const exercici = document.getElementById("ex" + i);

    resultats[i].resposta1 = resposta1;
    resultats[i].resposta2 = resposta2;

    if (resposta1 === correcte1 && resposta2 === correcte2) {
        resultats[i].estat = "CORRECTE";
        missatge.textContent = "MOLT BÉ! RESULTAT CORRECTE!";
        missatge.style.color = "green";
        exercici.classList.add("correcte");
        exercici.classList.remove("incorrecte");
    } else {
        resultats[i].estat = "INCORRECTE";
        missatge.textContent = "TORNA-HO A PROVAR!";
        missatge.style.color = "red";
        exercici.classList.add("incorrecte");
        exercici.classList.remove("correcte");
    }

    actualitzarResum();
}

function reiniciar(i) {
    document.getElementById("r1_" + i).value = "";
    document.getElementById("r2_" + i).value = "";

    document.getElementById("m" + i).textContent = "";

    const exercici = document.getElementById("ex" + i);
    exercici.classList.remove("correcte", "incorrecte");

    resultats[i].resposta1 = "";
    resultats[i].resposta2 = "";
    resultats[i].estat = "PENDENT";

    actualitzarResum();
}

function actualitzarResum() {
    const correctes = resultats.filter(r => r.estat === "CORRECTE").length;

    document.getElementById("resum").textContent =
        "EXERCICIS CORRECTES: " + correctes + " / " + dades.length;
}

function descarregarPDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();

    doc.setFont("helvetica", "bold");
    doc.setFontSize(18);
    doc.text("RESULTATS: MULTIPLICACIONS", 15, 20);

    doc.setFont("helvetica", "normal");
    doc.setFontSize(11);

    let y = 32;

    const correctes = resultats.filter(r => r.estat === "CORRECTE").length;
    const incorrectes = resultats.filter(r => r.estat === "INCORRECTE").length;
    const pendents = resultats.filter(r => r.estat === "PENDENT").length;

    doc.text("Exercicis correctes: " + correctes, 15, y);
    y += 7;
    doc.text("Exercicis incorrectes: " + incorrectes, 15, y);
    y += 7;
    doc.text("Exercicis pendents: " + pendents, 15, y);
    y += 12;

    doc.setFont("helvetica", "bold");
    doc.text("DETALL DELS EXERCICIS", 15, y);
    y += 9;

    doc.setFont("helvetica", "normal");

    dades.forEach((d, i) => {
        if (y > 270) {
            doc.addPage();
            y = 20;
        }

        const r = resultats[i];
        const resposta = (r.resposta1 || "(buit)") + (r.resposta2 || "");

        doc.text(
            (i + 1) + ". " + d.a + " x " + d.b +
            " = " + resposta +
            "  |  " + r.estat,
            15,
            y
        );

        y += 9;
    });

    doc.save("resultats_multiplicacions.pdf");
}

crearExercicis();

</script>

</body>
</html>
